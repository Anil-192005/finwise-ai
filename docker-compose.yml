version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: finwise_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: finwise
      POSTGRES_USER: finwise_user
      POSTGRES_PASSWORD: finwise_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finwise_user -d finwise"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finwise_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://finwise_user:finwise_secure_password_2026@db:5432/finwise
      SECRET_KEY: finwise_production_super_secret_key_change_me_2026
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finwise_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
